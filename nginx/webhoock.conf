server {
  server_name webhook.sisnato.com.br;

  location / {
    # Proxy para a porta HTTP (3005) do Node.js
    proxy_pass http://127.0.0.1:3003;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Passar informações do certificado do cliente para o Node.js
    proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
    proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
    proxy_set_header X-SSL-Client-Serial $ssl_client_serial;
    proxy_set_header X-SSL-Client-Fingerprint $ssl_client_fingerprint;
  }

  listen 443 ssl;

  # Certificados do servidor (Let's Encrypt) - gerenciados pelo Certbot
  ssl_certificate /etc/letsencrypt/live/webhook.sisnato.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/webhook.sisnato.com.br/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

  # Configuração mTLS - Específica para Efí
  ssl_verify_client on;
  ssl_client_certificate /var/www/html/webhook/webhook_pagamento/certs/public/certificate-chain-prod.crt;
  ssl_verify_depth 3;
}

server {
  if ($host = webhook.sisnato.com.br) {
    return 301 https://$host$request_uri;
  } # managed by Certbot

  server_name webhook.sisnato.com.br;
  listen 80;
  return 404; # managed by Certbot
}